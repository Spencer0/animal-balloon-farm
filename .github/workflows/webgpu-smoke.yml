name: WebGPU smoke

# The WebGPU renderer (?renderer=webgpu) is opt-in while WebGL stays the default,
# so the performance gate does not cover it. This job loads the farm under
# WebGPU on SwiftShader, checks it draws and plays the intro film, and fails on
# page errors. It does not measure speed: a software adapter says nothing about
# a real GPU, and budgets live in perf/budgets.json for WebGL only.
#
# If the runner cannot get a WebGPU adapter the script exits 3 and this job
# reports a notice and passes; a missing adapter is not a regression.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # Same pin as the performance gate, so the two see the same browser.
          chrome-version: 155.0.8059.39
          install-dependencies: true

      - name: Run the WebGPU smoke test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          node scripts/webgpu-smoke.mjs
          code=$?
          if [ "$code" = "3" ]; then
            echo "::notice::No WebGPU adapter on this runner; the WebGPU smoke test was skipped."
            exit 0
          fi
          exit "$code"
