name: Performance gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shovel-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build debug bundle
        env:
          PAGES_OUTDIR: dist-perf-stress
          GARDEN_DEBUG: '1'
        run: npm run check

      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Serve branch bundle, launch Chromium, and run the 60 FPS stress gate
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          GARDEN_URL: http://127.0.0.1:4173/
          GARDEN_CDP_URL: http://127.0.0.1:9222
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { createServer } from "node:http";
            import { createReadStream, existsSync } from "node:fs";
            import { extname, join, normalize } from "node:path";
            const root = "dist-perf-stress";
            const types = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".png": "image/png", ".jpg": "image/jpeg", ".webp": "image/webp", ".glb": "model/gltf-binary", ".json": "application/json", ".svg": "image/svg+xml" };
            createServer((req, res) => {
              const path = normalize(join(root, decodeURIComponent(new URL(req.url, "http://localhost").pathname)));
              const file = existsSync(path) && !path.endsWith("/") ? path : join(root, "index.html");
              res.setHeader("Content-Type", types[extname(file)] || "application/octet-stream");
              createReadStream(file).pipe(res);
            }).listen(4173, "127.0.0.1");
          ' &
          SERVER_PID=$!
          "${CHROME_BIN}" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir="${RUNNER_TEMP}/chrome-perf-profile" --window-size=1280,720 --force-device-scale-factor=1 --enable-gpu --use-gl=angle --use-angle=swiftshader-webgl --disable-background-timer-throttling --disable-renderer-backgrounding about:blank &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.2
          done
          GARDEN_URL=http://127.0.0.1:4173/ node scripts/perf-stress.mjs --json shovel.json
          GARDEN_URL=http://127.0.0.1:4173/ node scripts/perf-scenario.mjs --scenario crowd-ramp --ramp 10,20,30,40,50 --minFps 0 --json crowd-ramp.json

      - name: Upload perf scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-scenarios
          path: |
            shovel.json
            crowd-ramp.json
          if-no-files-found: warn
          retention-days: 14
