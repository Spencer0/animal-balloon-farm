name: Performance gate

# One command, same as on a laptop: `npm run gate` runs the unit tests, the
# production no-test-code check, and the browser stress budgets. Keep this
# file thin so local and CI results cannot drift apart.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Pinned so the Ubuntu 26 migration (announced for October 19, 2026)
    # cannot change Chrome or system libraries under this gate unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run the gate
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run gate

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: .gate/results
          if-no-files-found: warn
          retention-days: 14
