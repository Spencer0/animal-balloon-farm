name: Performance gate

# One command, same as on a laptop: `npm run gate` runs the unit tests, the
# production no-test-code check, and the browser stress budgets. Keep this
# file thin so local and CI results cannot drift apart.
# Runs once per pull request (pull_request) and once per merge to main (push to
# main, which deploys to Pages). Plain branch pushes do not run it: a PR already
# runs on every push to its branch, so running on both doubled every check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    # Pinned so the Ubuntu 26 migration (announced for October 19, 2026)
    # cannot change Chrome or system libraries under this gate unannounced.
    runs-on: ubuntu-24.04
    # The gate repeats the slow scenarios (median of 3) and a slow runner can
    # stretch each run, so 25 minutes was too tight.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # Pinned, not "stable": a Chrome release changes the renderer and
          # the frame timings under this gate with no code change. Bump it on
          # purpose, and recalibrate perf/budgets.json when you do.
          chrome-version: 155.0.8059.39
          install-dependencies: true

      - name: Run the gate
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run gate

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: .gate/results
          if-no-files-found: warn
          retention-days: 14
