<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elephant Express — Arcade Walker</title>
<style>
  :root { color-scheme: dark; --ink:#10132b; --cyan:#61f6e7; --pink:#ff5caa; --gold:#ffd166; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:#fff; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:#090b19; }
  .cabinet { width:min(94vw,760px); padding:18px; border:2px solid #54418a; border-radius:24px; background:linear-gradient(145deg,#191b3b,#11142b 62%,#211638); box-shadow:0 0 0 5px #0d0e20,0 0 60px #915cff25,inset 0 0 32px #8e5cff12; }
  .topline { display:flex; justify-content:space-between; align-items:center; padding:4px 8px 14px; color:#a8a5d3; font-size:11px; letter-spacing:.16em; }
  .brand { color:var(--cyan); font-weight:900; text-shadow:0 0 12px #61f6e799; }
  h1 { margin:0; color:#fff; text-align:center; font-size:clamp(24px,5vw,42px); line-height:1; letter-spacing:.08em; text-shadow:0 3px #7652c8,0 0 24px #bd72ff70; }
  .subtitle { text-align:center; margin:8px 0 14px; color:#b5b1d8; font-size:11px; letter-spacing:.2em; }
  .screen { position:relative; overflow:hidden; border:3px solid #6150a1; border-radius:13px; background:#131631; box-shadow:inset 0 0 25px #050615,0 0 22px #6b4bcb35; }
  svg { width:100%; display:block; }
  .scanlines { position:absolute; inset:0; pointer-events:none; opacity:.14; background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#08091b 4px); mix-blend-mode:multiply; }
  .controls { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; padding:15px 4px 2px; color:#c5c1e5; font-size:12px; }
  button { color:#e6e2ff; background:#302650; border:1px solid #9877e8; border-radius:8px; padding:9px 15px; font:700 11px inherit; font-family:inherit; letter-spacing:.08em; cursor:pointer; box-shadow:0 3px #17122a; }
  button:hover { background:#47336c; } button:focus-visible,input:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  input { accent-color:var(--pink); width:105px; vertical-align:middle; }
  .hint { width:100%; text-align:center; color:#8885ad; font-size:10px; letter-spacing:.12em; }
  .pixel { shape-rendering:crispEdges; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }
</style>
</head>
<body>
<main class="cabinet" aria-label="Arcade elephant animation">
  <div class="topline"><span class="brand">★ PIXEL PARADE ★</span><span>PLAYER 1 &nbsp; ♥♥♥</span></div>
  <h1>ELEPHANT EXPRESS</h1>
  <p class="subtitle">A BIG STEP INTO THE FUTURE</p>
  <div class="screen">
    <svg id="game" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
      <title id="title">A friendly elephant walking toward you</title><desc id="desc">A colorful, front-facing cartoon elephant walks in place on a neon arcade stage.</desc>
      <defs>
        <radialGradient id="sky" cx="50%" cy="39%" r="72%"><stop stop-color="#29255c"/><stop offset="1" stop-color="#10132b"/></radialGradient>
        <linearGradient id="hide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8a2ff"/><stop offset=".48" stop-color="#7779db"/><stop offset="1" stop-color="#5558b5"/></linearGradient>
        <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff83b7"/><stop offset="1" stop-color="#dc4d9e"/></linearGradient>
        <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9895f2"/><stop offset="1" stop-color="#696dca"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="stars" width="90" height="80" patternUnits="userSpaceOnUse"><circle cx="13" cy="17" r="1.5" fill="#fff" opacity=".65"/><circle cx="67" cy="55" r="1" fill="#71f6e8" opacity=".8"/><path d="M43 8v7m-3.5-3.5h7" stroke="#ff76bd" stroke-width="1.5" opacity=".8"/></pattern>
      </defs>
      <rect width="720" height="560" fill="url(#sky)"/><rect width="720" height="390" fill="url(#stars)"/>
      <g opacity=".35" stroke="#57e8e0" fill="none"><path d="M0 340H720M0 370H720M0 400H720"/><path d="M360 310L0 450m360-140L90 450m270-140L180 450m180-140L270 450m180-140L450 450m-90-140L540 450m-180-140L630 450m-270-140L720 450"/></g>
      <path d="M0 416H720V560H0Z" fill="#11152c" opacity=".76"/>
      <g fill="#ffd166" filter="url(#glow)" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2"><text x="27" y="45">STAGE 01</text><text x="570" y="45">WALK!</text></g>
      <g fill="#ff66b3"><path d="M85 78h13v13H85zm8-8h13v13H93zM615 91h12v12h-12zm8-8h12v12h-12z"/></g>
      <g fill="#65f5e3"><path d="M163 103h12v12h-12zm8-8h12v12h-12zM536 130h12v12h-12zm8-8h12v12h-12z"/></g>
      <ellipse id="shadow" cx="360" cy="472" rx="126" ry="19" fill="#050714" opacity=".7"/>
      <ellipse cx="360" cy="465" rx="105" ry="8" fill="#53f6e0" opacity=".28" filter="url(#glow)"/>
      <!-- Rear legs -->
      <g id="legBackL" transform="translate(0 0)"><path d="M287 366Q278 395 280 439L277 460Q282 472 319 470Q335 468 330 457L325 439 334 383Z" fill="#6267c5" stroke="#393b83" stroke-width="4"/><path d="M279 450Q302 458 331 449L333 462Q327 473 281 469Z" fill="#ffc56a"/></g>
      <g id="legBackR" transform="translate(0 0)"><path d="M389 379L401 436 395 458Q393 470 427 470Q449 469 442 456L435 435 433 375Z" fill="#696dc9" stroke="#393b83" stroke-width="4"/><path d="M394 450Q417 458 443 449L446 462Q440 473 397 469Z" fill="#ffc56a"/></g>
      <!-- Tail -->
      <g id="tail"><path d="M431 295Q471 316 457 355" fill="none" stroke="#686ac4" stroke-width="10" stroke-linecap="round"/><path d="M450 351l11 1-3 16-12-3z" fill="#ff66b3"/></g>
      <!-- Big ears, with separate inner panels -->
      <g id="earL"><path d="M304 183Q254 132 227 177Q208 221 264 286L309 273Z" fill="url(#hide)" stroke="#454895" stroke-width="5"/><path d="M293 198Q254 162 240 184Q233 211 271 251L299 252Z" fill="url(#ear)" opacity=".88"/></g>
      <g id="earR"><path d="M416 183Q466 132 493 177Q512 221 456 286L411 273Z" fill="url(#hide)" stroke="#454895" stroke-width="5"/><path d="M427 198Q466 162 480 184Q487 211 449 251L421 252Z" fill="url(#ear)" opacity=".88"/></g>
      <!-- Body -->
      <path d="M277 279Q279 250 310 243L410 243Q441 250 443 279L451 359Q449 391 417 401L303 401Q271 390 269 359Z" fill="url(#hide)" stroke="#41458e" stroke-width="5"/>
      <path d="M302 347Q360 365 418 347L412 389Q360 411 308 389Z" fill="#9694ed" opacity=".55"/>
      <path d="M306 265Q360 253 414 265" fill="none" stroke="#d0c5ff" stroke-width="5" opacity=".42" stroke-linecap="round"/>
      <!-- Front legs: offset phase, with chunky arcade boots -->
      <g id="legFrontL"><path d="M300 352Q296 384 301 429L296 455Q297 468 329 469Q350 468 345 455L339 428 344 364Z" fill="url(#hide)" stroke="#41458e" stroke-width="5"/><path d="M297 447Q320 455 346 445L350 459Q347 472 300 470Z" fill="#ffd166" stroke="#bd7c50" stroke-width="3"/><path d="M307 461h5m8 1h5m8-2h5" stroke="#fff5cd" stroke-width="3" stroke-linecap="round"/></g>
      <g id="legFrontR"><path d="M376 364L381 428 375 455Q370 468 400 469Q427 469 425 455L418 429 420 352Z" fill="url(#hide)" stroke="#41458e" stroke-width="5"/><path d="M372 447Q399 455 426 445L430 459Q426 472 378 470Z" fill="#ffd166" stroke="#bd7c50" stroke-width="3"/><path d="M382 461h5m8 1h5m8-2h5" stroke="#fff5cd" stroke-width="3" stroke-linecap="round"/></g>
      <!-- Head silhouette -->
      <path d="M291 207Q291 164 329 157Q360 147 391 157Q429 164 429 207L426 269Q421 302 389 311L331 311Q299 302 294 269Z" fill="url(#hide)" stroke="#41458e" stroke-width="5"/>
      <path d="M311 206Q325 194 340 207" fill="none" stroke="#d0c5ff" stroke-width="4" opacity=".6" stroke-linecap="round"/>
      <!-- Eyes -->
      <ellipse cx="333" cy="226" rx="17" ry="21" fill="#fff8df"/><ellipse cx="387" cy="226" rx="17" ry="21" fill="#fff8df"/>
      <ellipse cx="337" cy="230" rx="8" ry="12" fill="#263057"/><ellipse cx="383" cy="230" rx="8" ry="12" fill="#263057"/>
      <circle cx="340" cy="225" r="3.3" fill="#fff"/><circle cx="386" cy="225" r="3.3" fill="#fff"/>
      <path d="M320 201q13-9 25-1m28 0q13-8 26 1" fill="none" stroke="#41458e" stroke-width="5" stroke-linecap="round"/>
      <!-- Trunk: animated in small segments for a springy walk -->
      <g id="trunkRoot"><path d="M343 248Q360 256 377 248L378 269Q380 282 374 292L382 310Q388 327 376 339Q368 348 354 341Q346 336 351 327L359 311Q346 302 343 286Z" fill="url(#trunk)" stroke="#41458e" stroke-width="5" stroke-linejoin="round"/>
        <path d="M350 274Q360 281 374 276M351 285Q361 292 376 286M357 302Q365 308 378 300" fill="none" stroke="#c1b9ff" stroke-width="3" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="367" cy="337" rx="10" ry="5" fill="#ff8fbc" transform="rotate(16 367 337)"/>
      </g>
      <!-- Cheek freckles -->
      <g fill="#ff8fbc"><circle cx="315" cy="266" r="3"/><circle cx="322" cy="272" r="2.5"/><circle cx="405" cy="266" r="3"/><circle cx="398" cy="272" r="2.5"/></g>
      <path d="M334 299Q360 310 386 299" fill="none" stroke="#5559ad" stroke-width="3" opacity=".7"/>
      <g fill="#61f6e7" font-family="monospace" font-weight="bold" font-size="12" letter-spacing="2"><text x="30" y="519">POWER</text><text x="621" y="519">100%</text></g>
      <rect x="105" y="508" width="485" height="12" rx="6" fill="#302e57" stroke="#6760a2"/><rect x="110" y="512" width="410" height="4" rx="2" fill="#ff5caa" filter="url(#glow)"/>
      <g fill="#ffd166"><path d="M255 60h8v8h-8zm15 0h8v8h-8zm15 0h8v8h-8z"/></g>
    </svg>
    <div class="scanlines" aria-hidden="true"></div>
  </div>
  <div class="controls"><button id="toggle" type="button" aria-pressed="false">Ⅱ &nbsp; PAUSE</button><label for="speed">WALK SPEED <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Walk speed"></label><span id="speedReadout">1.0×</span><div class="hint">TIP: GIVE THIS LITTLE LEGEND SOME ROOM TO ROAM</div></div>
</main>
<script>
(() => {
  // Tiny procedural animation loop: sinusoidal gait, independent limb swing, and a buoyant body bob.
  const parts = Object.fromEntries(['legBackL','legBackR','legFrontL','legFrontR','earL','earR','trunkRoot','tail','shadow'].map(id => [id, document.getElementById(id)]));
  const toggle = document.getElementById('toggle');
  const speedControl = document.getElementById('speed');
  const speedReadout = document.getElementById('speedReadout');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase = 0, lastTime = 0, speed = 1, playing = !reducedMotion;
  function setPlaying(value) {
    playing = value;
    toggle.textContent = playing ? 'Ⅱ  PAUSE' : '▶  WALK';
    toggle.setAttribute('aria-pressed', String(!playing));
  }
  toggle.addEventListener('click', () => setPlaying(!playing));
  speedControl.addEventListener('input', () => { speed = Number(speedControl.value); speedReadout.textContent = `${speed.toFixed(1)}×`; });
  function frame(now) {
    const dt = Math.min((now - (lastTime || now)) / 1000, .05); lastTime = now;
    if (playing) {
      phase += dt * speed * 5.4;
      const stride = Math.sin(phase), lift = Math.max(0, Math.cos(phase));
      const backStride = Math.sin(phase + Math.PI);
      parts.legFrontL.setAttribute('transform', `translate(${stride*8} ${-lift*8}) rotate(${stride*7} 320 360)`);
      parts.legFrontR.setAttribute('transform', `translate(${-stride*8} ${-Math.max(0,-Math.cos(phase))*8}) rotate(${-stride*7} 400 360)`);
      parts.legBackL.setAttribute('transform', `translate(${backStride*5} ${-Math.max(0,Math.cos(phase+Math.PI))*5})`);
      parts.legBackR.setAttribute('transform', `translate(${-backStride*5} ${-Math.max(0,-Math.cos(phase+Math.PI))*5})`);
      parts.earL.setAttribute('transform', `rotate(${Math.sin(phase)*2.5} 286 225)`);
      parts.earR.setAttribute('transform', `rotate(${-Math.sin(phase)*2.5} 434 225)`);
      parts.trunkRoot.setAttribute('transform', `rotate(${Math.sin(phase+.6)*5} 360 250) translate(0 ${Math.sin(phase*2)*3})`);
      parts.tail.setAttribute('transform', `rotate(${Math.sin(phase+1)*12} 432 297)`);
      const bob = Math.abs(Math.sin(phase*2))*4;
      parts.shadow.setAttribute('rx', String(126 - bob*2));
      bodyShape.setAttribute('transform', `translate(0 ${-bob})`);
      headShape.setAttribute('transform', `translate(0 ${-bob})`);
    }
    requestAnimationFrame(frame);
  }
  const svg = document.getElementById('game');
  const bodyShape = svg.querySelector('path[d^="M277 279"]');
  const headShape = svg.querySelector('path[d^="M291 207"]');
  if (reducedMotion) setPlaying(false);
  requestAnimationFrame(frame); 
})();
</script>
</body>
</html>
